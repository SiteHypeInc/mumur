[package]
name = "murmur"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast, private voice dictation for any app."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
murmur-core = { path = "../../crates/murmur-core" }
murmur-sys = { path = "../../crates/murmur-sys" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger = "0.11"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
