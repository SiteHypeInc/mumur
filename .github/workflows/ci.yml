name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint + tests + real-model transcription
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev \
            xvfb xdotool xclip x11-utils python3-tk pulseaudio pulseaudio-utils libasound2-plugins \
            cmake clang libclang-dev
      - run: scripts/ci-run.sh cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/ci-run.sh cargo test --workspace
      - name: On-device transcription with a real whisper model
        run: |
          curl -sSfL -o /tmp/ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          MURMUR_TEST_MODEL=/tmp/ggml-tiny.en.bin scripts/ci-run.sh cargo test -p murmur-local --test real_model -- --nocapture

  e2e:
    name: End-to-end (Linux, virtual display)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev \
            xvfb xdotool xclip x11-utils python3-tk pulseaudio pulseaudio-utils libasound2-plugins \
            cmake clang libclang-dev
      - run: scripts/ci-run.sh cargo build -p murmur
      - name: Real hotkey, fake mic, mock providers, real paste
        run: PYTHON_TK=python3 scripts/ci-run.sh e2e/run_e2e.sh

  bundle:
    name: Bundle ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            args: --target aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/ci-run.sh cargo test --workspace
        shell: bash
      - name: Build installer
        shell: bash
        run: cd app && ../scripts/ci-run.sh npx -y @tauri-apps/cli@2 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: murmur-${{ matrix.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
