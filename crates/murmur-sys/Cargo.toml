[package]
name = "murmur-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS integration for Murmur: microphone, global hotkeys, paste, frontmost app."

[dependencies]
murmur-core = { path = "../murmur-core", default-features = false }
log.workspace = true
thiserror.workspace = true
cpal = "0.16"
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
libc = "0.2"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
enigo = "0.5"
rdev = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
